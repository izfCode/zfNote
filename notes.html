  .dropdown-item:hover { background: var(--bg-hover); }
</style>

<script>
const STORAGE_KEY = "star-notes-v1";
const state = {
  notes: [], currentId: null, search: "",
  isPreview: false,
  theme: localStorage.getItem("star-notes-theme") || "light",
  sidebarCollapsed: false,
};
const q = function(s, p) { return (p || document).querySelector(s); };
const qa = function(s, p) { return Array.from((p || document).querySelectorAll(s)); };
const uid = function() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
const fmt = function(ts) {
  var d = new Date(ts), now = new Date();
  var diff = (now - d) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
  if (diff < 604800) return Math.floor(diff / 86400) + " 天前";
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const fmtFull = function(ts) {
  var d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
};
const esc = function(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(m) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",",":"&quot;","'":"&#39;"})[m]; }); };
function loadNotes() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    state.notes = raw ? JSON.parse(raw) : [];
  } catch (e) { state.notes = []; }
  if (state.notes.length === 0) seedDemo();
}
function saveNotes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes)); }
function seedDemo() {
  var now = Date.now();
  var demo1Lines = [
    "# 你好,这里是张帆笔记",
    "",
    "这是你的第一个笔记。你可以:",
    "",
    "- 点击左上角的「新建笔记」开始记录",
    "- 使用 # 标题 / ## 子标题 来组织内容",
    "- 用 **粗体** 和 *斜体* 让文字更有表现力",
    "- 用 - 列出待办,用 1. 列出步骤",
    "- 给笔记添加标签,方便分类",
    "",
    "> 思考即星辰,记录即轨迹。",
    "",
    "---",
    "",
    "## Markdown 速查",
    "",
    "### 标题层级",
    "### **粗体** 和 *斜体*",
    "### 行内代码 和 代码块",
    "### [链接](https://example.com)",
    "",
    "试试切换右上角的「预览」按钮,看看渲染效果。"
  ];
  var demo2Lines = [
    "## 想读的书", "",
    "1. 《深度工作》", "2. 《思考,快与慢》", "3. 《原子习惯》", "4. 《禅与摩托车维修艺术》", "",
    "## 读书笔记模板", "",
    "- 这本书讲了什么?", "- 哪一段对我最有启发?", "- 我能在生活中用上哪一点?"
  ];
  var demo3Lines = [
    "随时记录下闪过的灵感... 比如:", "",
    "- 用游戏化让学习变得有趣", "- 用 AI 总结长会议", "- 用 Markdown 写文档比 Word 快得多"
  ];
  state.notes = [
    { id: uid(), title: "欢迎使用张帆笔记 ✦", content: demo1Lines.join("\n"), tags: ["入门","指南"], pinned: true, createdAt: now, updatedAt: now },
    { id: uid(), title: "本周阅读清单", content: demo2Lines.join("\n"), tags: ["阅读","个人"], pinned: false, createdAt: now - 86400000, updatedAt: now - 3600000 },
    { id: uid(), title: "项目灵感片段", content: demo3Lines.join("\n"), tags: ["灵感"], pinned: false, createdAt: now - 172800000, updatedAt: now - 86400000 }
  ];
  saveNotes();
}
function sunSvg() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>'; }
function moonSvg() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'; }
function previewSvg() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; }
function editSvg() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'; }
function pinSvg(f) { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + (f ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 8.5 22 9.3 17 14 18.5 21 12 17.8 5.5 21 7 14 2 9.3 9 8.5z"/></svg>'; }
function exportSvg() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'; }
function trashSvg() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'; }
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  localStorage.setItem("star-notes-theme", state.theme);
  var btn = document.getElementById("themeBtn");
  if (btn) btn.innerHTML = state.theme === "light" ? sunSvg() : moonSvg();
}
function toast(msg, icon) {
  icon = icon || "✓";
  var el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = "<span>" + icon + "</span><span>" + esc(msg) + "</span>";
  document.getElementById("toastWrap").appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}
function confirmModal(title, body, onConfirm, confirmText, danger) {
  confirmText = confirmText || "确认";
  danger = danger !== false;
  var host = document.getElementById("modalHost");
  host.innerHTML = '<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-header"><div class="modal-title">' + esc(title) + '</div></div><div class="modal-body">' + esc(body) + '</div></div><div class="modal-footer"><button class="btn btn-secondary" data-act="cancel">取消</button><button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" data-act="ok">' + esc(confirmText) + '</button></div></div></div>';
  var close = function() { host.innerHTML = ""; };
  host.querySelector("[data-act=cancel]").onclick = close;
  host.querySelector("[data-act=ok]").onclick = function() { close(); onConfirm(); };
  host.querySelector("#modalBackdrop").onclick = function(e) { if (e.target.id === "modalBackdrop") close(); };
}
// 反引号字符
var BT = String.fromCharCode(96);
function renderMarkdown(text) {
  var html = esc(text);
  // 代码块: 三个反引号包围
  var codeBlockRe = new RegExp(BT + BT + BT + "([\\w]*)\\n([\\s\\S]*?)" + BT + BT + BT, "g");
  html = html.replace(codeBlockRe, function(m, lang, code) { return "<pre><code>" + code + "</code></pre>"; });
  // 行内代码
  var inlineCodeRe = new RegExp(BT + "([^" + BT + "\\n]+)" + BT, "g");
  html = html.replace(inlineCodeRe, "<code>$1</code>");
  // 标题
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  // 引用
  html = html.replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>");
  // 分隔线
  html = html.replace(/^---$/gm, "<hr>");
  // 粗体/斜体
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  // 链接
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1</a>");
  // 无序列表
  html = html.replace(/(^- .+(\n- .+)*)/gm, function(block) {
    var items = block.split("\n").map(function(l) { return l.replace(/^- /, ""); }).map(function(l) { return "<li>" + l + "</li>"; }).join("");
    return "<ul>" + items + "</ul>";
  });
  // 有序列表
  html = html.replace(/(^\d+\. .+(\n\d+\. .+)*)/gm, function(block) {
    var items = block.split("\n").map(function(l) { return l.replace(/^\d+\. /, ""); }).map(function(l) { return "<li>" + l + "</li>"; }).join("");
    return "<ol>" + items + "</ol>";
  });
  // 段落
  html = html.split(/\n\n+/).map(function(p) {
    if (/^<(h\d|ul|ol|li|pre|blockquote|hr)/.test(p.trim())) return p;
    return p.split("\n").map(function(l) { return l.trim() ? "<p>" + l + "</p>" : ""; }).join("");
  }).join("\n");
  return html;
}
function renderList() {
  var host = document.getElementById("notesList");
  var kw = state.search.toLowerCase().trim();
  var list = state.notes.slice();
  if (kw) {
    list = list.filter(function(n) {
      return (n.title || "").toLowerCase().includes(kw) ||
        (n.content || "").toLowerCase().includes(kw) ||
        (n.tags || []).some(function(t) { return t.toLowerCase().includes(kw); });
    });
  }
  var pinned = list.filter(function(n) { return n.pinned; }).sort(function(a, b) { return b.updatedAt - a.updatedAt; });
  var others = list.filter(function(n) { return !n.pinned; }).sort(function(a, b) { return b.updatedAt - a.updatedAt; });
  if (list.length === 0) {
    host.innerHTML = '<div class="empty-list"><div class="empty-list-icon">📝</div><div>' + (kw ? "没有匹配的笔记" : "还没有笔记") + '</div><div style="margin-top:6px;font-size:11px;opacity:0.7">' + (kw ? "试试别的关键词" : "点击「新建笔记」开始记录") + '</div></div>';
    return;
  }
  var html = "";
  if (pinned.length) {
    html += '<div class="list-section-title">📌 已置顶 <span class="count">' + pinned.length + '</span></div>';
    html += pinned.map(renderItem).join("");
  }
  if (others.length) {
    html += '<div class="list-section-title">📄 所有笔记 <span class="count">' + others.length + '</span></div>';
    html += others.map(renderItem).join("");
  }
  host.innerHTML = html;
  qa(".note-item", host).forEach(function(el) { el.onclick = function() { selectNote(el.dataset.id); }; });
}
function renderItem(n) {
  var preview = (n.content || "").replace(/[#*`>\-\n]+/g, " ").trim().slice(0, 40);
  var active = n.id === state.currentId ? "active" : "";
  var pinSpan = n.pinned ? '<span class="pin-icon">📌</span>' : "";
  var previewDiv = preview ? '<div class="note-item-preview">' + esc(preview) + '</div>' : "";
  var tagSpan = (n.tags && n.tags[0]) ? '<span class="note-tag">' + esc(n.tags[0]) + '</span>' : "";
  return '<div class="note-item ' + active + '" data-id="' + n.id + '"><div class="note-item-title">' + pinSpan + esc(n.title || "无标题") + '</div>' + previewDiv + '<div class="note-item-meta"><span>' + fmt(n.updatedAt) + '</span>' + tagSpan + '</div></div>';
}
function renderEditor() {
  var wrap = document.getElementById("editorWrap");
  var actions = document.getElementById("topbarActions");
  var statusbar = document.getElementById("statusbar");
  var note = state.notes.find(function(n) { return n.id === state.currentId; });
  if (!note) {
    actions.innerHTML = '<button class="icon-btn" id="themeBtn" title="切换主题">' + (state.theme === "light" ? sunSvg() : moonSvg()) + '</button>';
    document.getElementById("themeBtn").onclick = function() { state.theme = state.theme === "light" ? "dark" : "light"; applyTheme(); };
    document.getElementById("crumbNote").textContent = "· 未选择";
    statusbar.style.display = "none";
    wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✦</div><div class="empty-state-title">' + (state.notes.length ? "选择一篇笔记开始阅读" : "欢迎使用张帆笔记") + '</div><div class="empty-state-text">' + (state.notes.length ? "从左侧列表选择一篇,或点击下方按钮新建你的第一篇笔记。" : "一个轻量、本地化、支持 Markdown 的私人思考空间。") + '</div><button class="empty-state-btn" id="emptyNewBtn">' + (state.notes.length ? "新建笔记" : "开始记录") + '</button></div>';
    document.getElementById("emptyNewBtn").onclick = createNote;
    return;
  }
  actions.innerHTML =
    '<button class="icon-btn ' + (state.isPreview ? "active" : "") + '" id="previewBtn" title="' + (state.isPreview ? "编辑" : "预览") + '">' + (state.isPreview ? editSvg() : previewSvg()) + '</button>' +
    '<button class="icon-btn ' + (note.pinned ? "active" : "") + '" id="pinBtn" title="' + (note.pinned ? "取消置顶" : "置顶") + '">' + pinSvg(note.pinned) + '</button>' +
    '<div class="divider-v"></div>' +
    '<button class="icon-btn" id="exportBtn" title="导出">' + exportSvg() + '</button>' +
    '<button class="icon-btn danger" id="deleteBtn" title="删除">' + trashSvg() + '</button>' +
    '<div class="divider-v"></div>' +
    '<button class="icon-btn" id="themeBtn" title="切换主题">' + (state.theme === "light" ? sunSvg() : moonSvg()) + '</button>';
  document.getElementById("previewBtn").onclick = function() { state.isPreview = !state.isPreview; renderEditor(); };
  document.getElementById("pinBtn").onclick = function() { note.pinned = !note.pinned; saveNotes(); renderList(); renderEditor(); toast(note.pinned ? "已置顶" : "已取消置顶", "📌"); };
  document.getElementById("deleteBtn").onclick = function() { deleteNote(note); };
  document.getElementById("themeBtn").onclick = function() { state.theme = state.theme === "light" ? "dark" : "light"; applyTheme(); };
  document.getElementById("exportBtn").onclick = function(e) { showExportMenu(e.currentTarget, note); };
  document.getElementById("crumbNote").textContent = "· " + (note.title || "无标题");
  var tagsHtml = (note.tags || []).map(function(t) { return '<span class="tag-chip">' + esc(t) + '<span class="tag-remove" data-tag="' + esc(t) + '">×</span></span>'; }).join("");
  var tagPh = (note.tags || []).length ? "添加标签..." : "+ 标签";
  var body;
  if (state.isPreview) {
    body = '<div class="preview-body" id="previewBody">' + renderMarkdown(note.content || "") + '</div>';
  } else {
    body = '<textarea class="editor-body" id="bodyInput" placeholder="开始记录你的想法...">' + esc(note.content || "") + '</textarea>';
  }
  wrap.innerHTML =
    '<input class="editor-title" id="titleInput" placeholder="无标题" value="' + esc(note.title || "") + '" />' +
    '<div class="editor-meta-bar">' +
      '<span class="meta-item"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>创建于 ' + fmtFull(note.createdAt) + '</span>' +
      '<span class="meta-item"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>修改于 ' + fmtFull(note.updatedAt) + '</span>' +
      '<div class="tag-input-wrap" id="tagWrap">' + tagsHtml + '<input class="tag-input" id="tagInput" placeholder="' + tagPh + '" /></div>' +
    '</div>' +
    body;
  var titleInput = document.getElementById("titleInput");
  var bodyInput = document.getElementById("bodyInput");
  var tagInput = document.getElementById("tagInput");
  var tagWrap = document.getElementById("tagWrap");
  var saveTimer;
  var scheduleSave = function() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() { saveNotes(); renderList(); updateStatus(note); }, 350);
  };
  titleInput.oninput = function() {
    note.title = titleInput.value;
    note.updatedAt = Date.now();
    scheduleSave();
    document.getElementById("crumbNote").textContent = "· " + (note.title || "无标题");
  };
  if (bodyInput) {
    bodyInput.style.height = "auto";
    bodyInput.style.height = Math.max(bodyInput.scrollHeight, 360) + "px";
    bodyInput.oninput = function() {
      note.content = bodyInput.value;
      note.updatedAt = Date.now();
      bodyInput.style.height = "auto";
      bodyInput.style.height = Math.max(bodyInput.scrollHeight, 360) + "px";
      scheduleSave();
    };
  }
  if (tagInput) {
    tagInput.onkeydown = function(e) {
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        var v = tagInput.value.trim().replace(/^#/, "");
        if (!v) return;
        note.tags = note.tags || [];
        if (note.tags.indexOf(v) === -1) {
          note.tags.push(v);
          note.updatedAt = Date.now();
          saveNotes();
          renderEditor();
          renderList();
          setTimeout(function() { var t = document.getElementById("tagInput"); if (t) t.focus(); }, 0);
        }
        tagInput.value = "";
      } else if (e.key === "Backspace" && !tagInput.value && note.tags && note.tags.length) {
        note.tags.pop();
        note.updatedAt = Date.now();
        saveNotes();
        renderEditor();
        renderList();
        setTimeout(function() { var t = document.getElementById("tagInput"); if (t) t.focus(); }, 0);
      }
    };
  }
  qa(".tag-remove", tagWrap).forEach(function(el) {
    el.onclick = function() {
      var t = el.dataset.tag;
      note.tags = (note.tags || []).filter(function(x) { return x !== t; });
      note.updatedAt = Date.now();
      saveNotes();
      renderEditor();
      renderList();
    };
  });
  statusbar.style.display = "flex";
  updateStatus(note);
  if (!note.title) { setTimeout(function() { titleInput.focus(); }, 50); }
}
function updateStatus(note) {
  if (!note) return;
  var content = note.content || "";
  var chars = content.length;
  var words = content.trim() ? content.trim().split(/\s+/).length : 0;
  var lines = content.split("\n").length;
  document.getElementById("statusLeft").textContent = "已自动保存";
  document.getElementById("statusRight").innerHTML = "<span>" + lines + " 行</span><span>" + words + " 词</span><span>" + chars + " 字符</span><span>UTF-8</span>";
}
function createNote() {
  var now = Date.now();
  var n = { id: uid(), title: "", content: "", tags: [], pinned: false, createdAt: now, updatedAt: now };
  state.notes.unshift(n);
  state.currentId = n.id;
  saveNotes();
  renderList();
  renderEditor();
  toast("已新建笔记", "📝");
}
function selectNote(id) {
  if (id === state.currentId) return;
  state.currentId = id;
  renderList();
  renderEditor();
}
function deleteNote(note) {
  confirmModal("删除笔记", "确定要删除「" + (note.title || "无标题") + "」吗?此操作不可撤销。", function() {
    state.notes = state.notes.filter(function(n) { return n.id !== note.id; });
    if (state.currentId === note.id) state.currentId = state.notes[0] ? state.notes[0].id : null;
    saveNotes();
    renderList();
    renderEditor();
    toast("已删除", "🗑");
  });
}
function showExportMenu(btn, note) {
  closeDropdown();
  var menu = document.createElement("div");
  menu.className = "dropdown-menu";
  menu.id = "activeDropdown";
  menu.innerHTML =
    '<div class="dropdown-item" data-fmt="md">📄 导出为 Markdown</div>' +
    '<div class="dropdown-item" data-fmt="txt">📃 导出为纯文本</div>' +
    '<div class="dropdown-item" data-fmt="json">💾 导出所有数据 (JSON)</div>' +
    '<div class="dropdown-item" data-fmt="copy">📋 复制内容</div>';
  document.body.appendChild(menu);
  var r = btn.getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + "px";
  menu.style.right = (window.innerWidth - r.right) + "px";
  qa(".dropdown-item", menu).forEach(function(it) {
    it.onclick = function() {
      var f = it.dataset.fmt;
      var fname = (note.title || "未命名").replace(/[\\\/:*?"<>|]/g, "_");
      if (f === "md" || f === "txt") {
        var body = f === "txt" ? note.content : "# " + (note.title || "未标题") + "\n\n" + (note.content || "");
        download(fname + "." + f, body, f === "md" ? "text/markdown" : "text/plain");
        toast("已导出 " + f.toUpperCase(), "📄");
      } else if (f === "json") {
        download("star-notes-backup.json", JSON.stringify(state.notes, null, 2), "application/json");
        toast("已导出全部数据", "💾");
      } else if (f === "copy") {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(note.content || "").then(function() { toast("已复制到剪贴板", "📋"); });
        } else {
          toast("剪贴板不可用", "⚠");
        }
      }
      closeDropdown();
    };
  });
  setTimeout(function() { document.addEventListener("click", closeDropdown, { once: true }); }, 0);
}
function closeDropdown() { var m = document.getElementById("activeDropdown"); if (m) m.remove(); }
function download(name, content, mime) {
  var blob = new Blob([content], { type: mime + ";charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
function toggleSidebar() {
  state.sidebarCollapsed = !state.sidebarCollapsed;
  document.getElementById("app").classList.toggle("sidebar-collapsed", state.sidebarCollapsed);
  document.getElementById("sidebar").classList.toggle("collapsed", state.sidebarCollapsed);
}
function bindEvents() {
  document.getElementById("newNoteBtn").onclick = createNote;
  document.getElementById("sidebarToggle").onclick = toggleSidebar;
  document.getElementById("searchInput").oninput = function(e) { state.search = e.target.value; renderList(); };
  document.addEventListener("keydown", function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "n") { e.preventDefault(); createNote(); }
    if ((e.ctrlKey || e.metaKey) && e.key === "p" && state.currentId) { e.preventDefault(); state.isPreview = !state.isPreview; renderEditor(); }
    if ((e.ctrlKey || e.metaKey) && e.key === "d" && state.currentId) { e.preventDefault(); deleteNote(state.notes.find(function(n) { return n.id === state.currentId; })); }
    if ((e.ctrlKey || e.metaKey) && e.key === "/") { e.preventDefault(); document.getElementById("searchInput").focus(); }
    if (e.key === "Escape" && document.activeElement === document.getElementById("searchInput")) {
      var si = document.getElementById("searchInput");
      si.value = ""; state.search = ""; renderList(); si.blur();
    }
  });
}
function init() {
  loadNotes();
  applyTheme();
  bindEvents();
  if (state.notes.length) state.currentId = state.notes[0].id;
  renderList();
  renderEditor();
}
init();
</script>
</body>
</html>
